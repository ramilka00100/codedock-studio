<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CodeDock Studio</title>
    <meta name="description" content="CodeDock Studio — мобильный редактор HTML, CSS и JS с предпросмотром и консолью.">

    <!-- Закомментировано до создания реальных файлов, чтобы не было 404 в консоли -->
    <!-- <link rel="manifest" href="manifest.json"> -->
    <meta name="theme-color" content="#13131a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CodeDock">

    <!-- <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"> -->
    <!-- <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png"> -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #13131a;
            --bg-panel: #181822;
            --bg-card: #1f1f2c;
            --bg-hover: #282838;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #8e92a4;
            --border: #2c2c3d;
            --danger: #ef4444;
            --success: #4ade80;
            --info: #38bdf8;
            --warn: #facc15;
            --editor-font-size: 13px;
            --editor-font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0f;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .workspace {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            overflow: hidden;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 50;
            flex-shrink: 0;
        }

        .logo-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: transform 0.1s, opacity 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .logo-btn:active { transform: scale(0.95); opacity: 0.8; }
        .brand-logo { height: 44px; width: auto; object-fit: contain; }

        .save-status {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 16px;
        }

        .save-status i { font-size: 0.65rem; }
        .save-status.saving { color: var(--warn); }
        .save-status.saved { color: var(--success); }
        .save-status.error { color: var(--danger); }

        .editor-topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .btn-icon-only {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
            position: relative;
        }

        .btn-icon-only:active { transform: scale(0.95); border-color: var(--accent); }

        .tabs-bar { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
        .tabs-bar::-webkit-scrollbar { display: none; }

        .tab-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 11px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            position: relative;
        }

        .tab-chip.active { color: var(--text-main); border-color: var(--accent); background-color: rgba(139, 92, 246, 0.14); }

        .tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-left: 2px;
            border-radius: 4px;
            color: var(--text-muted);
            font-size: 0.75rem;
            transition: all 0.15s;
        }

        .tab-close:hover, .tab-close:active { background-color: rgba(255, 255, 255, 0.1); color: var(--danger); }

        .editor-body { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; background-color: var(--bg-main); }

        .editor-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            z-index: 10;
            flex-shrink: 0;
        }

        .action-group { display: flex; gap: 8px; width: 100%; justify-content: space-between; }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 34px;
            padding: 0;
            width: 34px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            flex-shrink: 0;
        }

        .btn-action:active { transform: scale(0.96); }
        .btn-icon { background-color: var(--bg-card); color: var(--text-main); border-color: var(--border); }
        .btn-icon:active { border-color: var(--accent); color: var(--accent); }
        .btn-run { background-color: var(--accent); color: #fff; box-shadow: 0 2px 8px var(--accent-glow); }

        .editor-content { flex: 1; display: flex; position: relative; overflow: hidden; }

        #codeEditor {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 100%;
            z-index: 2;
        }

        .cm-editor {
            height: 100%;
            font-family: var(--editor-font-family);
            font-size: var(--editor-font-size);
            background-color: var(--bg-main) !important;
        }
        
        .cm-editor .cm-scroller {
            font-family: inherit;
            line-height: 1.6;
            padding: 14px 12px 40px 12px;
        }

        .cm-editor .cm-content { caret-color: var(--accent); }
        .cm-editor .cm-lineWrapping { white-space: pre-wrap; overflow-wrap: anywhere; }
        .cm-editor.cm-focused { outline: none !important; }

        .cm-scroller::-webkit-scrollbar { width: 6px; height: 6px; }
        .cm-scroller::-webkit-scrollbar-track { background: transparent; }
        .cm-scroller::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .cm-scroller::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .cm-editor .cm-gutters {
            background-color: #101016 !important;
            border-right: 1px solid var(--border) !important;
            color: #52566b;
            padding-left: 4px;
        }
        
        .cm-editor .cm-activeLineGutter {
            background-color: rgba(139, 92, 246, 0.1) !important;
            color: var(--accent);
        }

        .edge-swipe-area { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; z-index: 15; touch-action: pan-y; }

        .drawer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease;
            z-index: 20;
        }

        .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

        .file-drawer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 84%;
            max-width: 340px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 30;
            touch-action: pan-y;
        }

        .file-drawer.open { transform: translateX(0); }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            padding: 12px 12px;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-main);
        }

        .header-title { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 700; color: var(--accent); }
        .header-actions { display: flex; gap: 6px; align-items: center; }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary:active { background-color: var(--accent-hover); }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 11px;
            border-radius: 11px;
            width: 100%;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
        }

        .search-box { padding: 10px 14px 6px; position: relative; }

        .search-box i {
            position: absolute;
            left: 25px;
            top: calc(50% + 2px);
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .search-box input {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            padding: 9px 10px 9px 32px;
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            font-size: 0.88rem;
        }

        .search-box input:focus { border-color: var(--accent); }

        .file-tree-container { flex: 1; overflow-y: auto; padding: 8px 14px 14px; touch-action: pan-y; }

        .tree-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            margin-bottom: 6px;
            background-color: var(--bg-card);
            border: 1px solid transparent;
            border-radius: 11px;
            cursor: pointer;
        }

        .tree-item.active { border-color: var(--accent); background-color: rgba(139, 92, 246, 0.14); }

        .tree-info { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
        .tree-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }

        .chevron-icon { font-size: 0.68rem; color: var(--text-muted); width: 10px; transition: transform 0.2s; }
        .chevron-icon.rotated { transform: rotate(90deg); }

        .folder-children { padding-left: 14px; border-left: 1px dashed var(--border); margin-left: 12px; margin-bottom: 6px; display: none; }
        .folder-children.open { display: block; }

        .tree-actions { display: flex; gap: 4px; margin-left: 6px; }

        .action-icon {
            background-color: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .action-icon.delete:hover { color: var(--danger); background-color: rgba(239, 68, 68, 0.15); }

        .icon-html { color: #e34c26; }
        .icon-css { color: #38bdf8; }
        .icon-js { color: #facc15; }
        .icon-json { color: #4ade80; }
        .icon-folder { color: #a78bfa; }
        .icon-default { color: var(--text-muted); }

        .project-stats {
            padding: 7px 14px;
            font-size: 0.76rem;
            color: var(--text-muted);
            background-color: var(--bg-main);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .file-footer { padding: 10px 14px 14px; background-color: var(--bg-main); }

        .preview-overlay {
            position: absolute;
            inset: 0;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.25s ease;
            z-index: 40;
        }

        .preview-overlay.open { transform: translateY(0); }

        .preview-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background-color: var(--bg-main);
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .preview-frame { flex: 1; width: 100%; border: none; background: #fff; }

        .console-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 38%;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 35;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
        }

        .console-panel.open { transform: translateY(0); }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
        }

        .console-header-actions { display: flex; gap: 8px; }

        .console-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 4px; }
        .console-btn:active { color: var(--accent); }

        .console-output {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px;
            font-family: var(--editor-font-family);
            font-size: 12px;
            line-height: 1.4;
        }

        .console-line {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            word-wrap: break-word;
            white-space: pre-wrap;
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .console-line i { margin-top: 2px; font-size: 10px; }

        .console-line.log { color: var(--text-main); }
        .console-line.info { color: var(--info); }
        .console-line.warn { color: var(--warn); background: rgba(250, 204, 21, 0.1); }
        .console-line.error { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
        .console-line .stack { display: block; color: var(--text-muted); font-size: 11px; margin-top: 4px; }

        .console-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            display: none;
        }

        .console-dot.show { display: block; }

        .custom-context-menu {
            position: fixed;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            padding: 6px;
            z-index: 9999;
            min-width: 160px;
            backdrop-filter: blur(8px);
        }

        .custom-context-menu.open { display: flex; }

        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
        }

        .context-menu-item:hover { background-color: var(--bg-hover); color: var(--accent); }
        .context-menu-item i { width: 16px; text-align: center; color: var(--text-muted); }
        .context-menu-item:hover i { color: var(--accent); }

        .symbol-bar {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
            position: relative;
            z-index: 20;
        }

        .symbol-bar::-webkit-scrollbar { display: none; }

        .sym-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            min-width: 36px;
            height: 34px;
            padding: 0 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .sym-btn:active { background-color: var(--accent); border-color: var(--accent); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-card {
            background-color: var(--bg-card);
            width: 92%;
            max-width: 340px;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-type-select { display: flex; gap: 8px; }

        .type-btn {
            flex: 1;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
        }

        .type-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .modal-field { display: flex; flex-direction: column; gap: 5px; }
        .modal-field label { font-size: 0.78rem; color: var(--text-muted); }

        .modal-card input,
        .modal-card select {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.92rem;
            outline: none;
        }

        .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
        .modal-actions button { flex: 1; justify-content: center; }

        .modal-check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .modal-check input { width: 18px; height: 18px; }

        .search-panel {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 25;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 8px 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .search-panel.open { display: flex; }

        .search-row { display: flex; gap: 6px; align-items: center; }

        .search-row input {
            flex: 1;
            min-width: 0;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text-main);
            padding: 8px 10px;
            font-size: 0.88rem;
            outline: none;
        }

        .search-row input:focus { border-color: var(--accent); }

        .search-count { font-size: 0.75rem; color: var(--text-muted); min-width: 48px; text-align: center; }

        .search-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .search-btn:active { border-color: var(--accent); color: var(--accent); }
        .search-btn.wide { width: auto; padding: 0 10px; font-size: 0.8rem; font-weight: 600; }

        .toast-container {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(env(safe-area-inset-bottom) + 74px);
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: min(92%, 420px);
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 0.86rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            animation: toast-in 0.18s ease;
        }

        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        .toast.warn { border-left-color: var(--warn); }
        .toast span { flex: 1; }

        .toast button {
            background: transparent;
            border: none;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .toast button:active { background: rgba(139, 92, 246, 0.15); }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden-file-input {
            position: fixed;
            left: -9999px;
            top: 0;
            opacity: 0;
            width: 1px;
            height: 1px;
        }
    </style>
</head>
<body>

<!-- SVG-градиент для логотипа -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="cdGrad" x1="0" y1="0" x2="1" y2="1">

<div class="workspace" id="workspace">
    <div class="brand-header">
        <button class="logo-btn" id="resetCacheBtn" title="Сбросить кэш и перезагрузить" aria-label="Сбросить кэш и перезагрузить">
            <!-- Встроенный SVG-логотип вместо отсутствующего logo.png -->
            <svg class="brand-logo" viewBox="0 0 100 100" aria-hidden="true">
                <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#cdGrad)"/>
                <rect x="14" y="14" width="72" height="72" rx="14" fill="#13131a"/>
                <rect x="18" y="18" width="64" height="64" rx="10" fill="url(#cdGrad)"/>
                <path d="M36 38 L26 50 L36 62" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M64 38 L74 50 L64 62" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M54 34 L46 66" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="26" cy="26" r="4" fill="#ef4444"/>
                <circle cx="40" cy="26" r="4" fill="#facc15"/>
                <circle cx="54" cy="26" r="4" fill="#22c55e"/>
            </svg>
        </button>
        <div class="save-status" id="saveStatus" aria-live="polite"></div>
    </div>

    <header class="editor-topbar">
        <button class="btn-icon-only" id="openDrawerBtn" title="Файлы проекта" aria-label="Файлы проекта">
            <i class="fa-solid fa-folder-tree"></i>
        </button>
        <div class="tabs-bar" id="tabsBar"></div>
    </header>

    <main class="editor-body">
        <div class="editor-action-bar">
            <div class="action-group">
                <button class="btn-action btn-icon" id="undoBtn" title="Отменить" aria-label="Отменить"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="btn-action btn-icon" id="redoBtn" title="Повторить" aria-label="Повторить"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="btn-action btn-icon" id="searchBtn" title="Поиск и замена" aria-label="Поиск и замена"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button class="btn-action btn-icon" id="settingsBtn" title="Настройки" aria-label="Настройки"><i class="fa-solid fa-gear"></i></button>
                <button class="btn-action btn-icon" id="consoleBtn" title="Консоль" aria-label="Консоль">
                    <i class="fa-solid fa-terminal"></i>
                    <span class="console-dot" id="consoleDot"></span>
                </button>
                <button class="btn-action btn-icon" id="saveProjectBtn" title="Сохранить" aria-label="Сохранить"><i class="fa-solid fa-floppy-disk"></i></button>
                <button class="btn-action btn-icon btn-run" id="runProjectBtn" title="Запуск" aria-label="Запуск"><i class="fa-solid fa-play"></i></button>
            </div>
        </div>

        <div class="search-panel" id="searchPanel">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Найти в файле" autocomplete="off" autocapitalize="off" autocorrect="off">
                <span class="search-count" id="searchCount">0/0</span>
                <button class="search-btn" id="searchPrev" title="Предыдущее" aria-label="Предыдущее"><i class="fa-solid fa-chevron-up"></i></button>
                <button class="search-btn" id="searchNext" title="Следующее" aria-label="Следующее"><i class="fa-solid fa-chevron-down"></i></button>
                <button class="search-btn" id="searchClose" title="Закрыть" aria-label="Закрыть"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="search-row">
                <input type="text" id="replaceInput" placeholder="Заменить на" autocomplete="off" autocapitalize="off" autocorrect="off">
                <button class="search-btn wide" id="replaceOne">Заменить</button>
                <button class="search-btn wide" id="replaceAll">Все</button>
            </div>
        </div>

        <div class="editor-content">
            <div id="codeEditor"></div>
            <div class="edge-swipe-area" id="edgeSwipeArea"></div>
        </div>

        <div class="console-panel" id="consolePanel" aria-label="Консоль">
            <div class="console-header">
                <span><i class="fa-solid fa-terminal"></i> Консоль</span>
                <div class="console-header-actions">
                    <button class="console-btn" id="clearConsoleBtn" title="Очистить" aria-label="Очистить консоль"><i class="fa-solid fa-trash"></i></button>
                    <button class="console-btn" id="closeConsoleBtn" title="Закрыть" aria-label="Закрыть консоль"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="console-output" id="consoleOutput"></div>
        </div>

        <div class="drawer-backdrop" id="drawerBackdrop"></div>

        <aside class="file-drawer" id="fileDrawer" aria-label="Файлы проекта">
            <div class="file-header">
                <div class="header-title">
                    <i class="fa-solid fa-folder-tree"></i>
                    <span>Файлы</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon-only" style="width:32px;height:32px;" id="importBtn" title="Импорт проекта" aria-label="Импорт проекта">
                        <i class="fa-solid fa-file-arrow-up"></i>
                    </button>
                    <button class="btn-icon-only" style="width:32px;height:32px;" id="exportZipBtn" title="Скачать ZIP" aria-label="Скачать проект в ZIP">
                        <i class="fa-solid fa-file-arrow-down"></i>
                    </button>
                    <button class="btn-icon-only" style="width:32px;height:32px;" id="collapseAllBtn" title="Свернуть папки" aria-label="Свернуть папки">
                        <i class="fa-solid fa-angles-up"></i>
                    </button>
                    <button class="btn-primary" id="openCreateModal">
                        <i class="fa-solid fa-plus"></i> Новый
                    </button>
                </div>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="fileSearch" placeholder="Поиск файлов..." aria-label="Поиск файлов">
            </div>
            <div class="file-tree-container" id="fileTree"></div>
            <div class="project-stats">
                <span id="statsText">Файлов: 0 | Папок: 0</span>
                <span id="linesCountText">Строк: 0</span>
            </div>
            <div class="file-footer">
                <button class="btn-secondary" id="closeDrawerBtn">Закрыть</button>
            </div>
        </aside>
    </main>

    <div class="symbol-bar" id="symbolBar">
        <button class="sym-btn" data-sym="  ">TAB</button>
        <button class="sym-btn" data-sym="{">{</button>
        <button class="sym-btn" data-sym="}">}</button>
        <button class="sym-btn" data-sym="(">(</button>
        <button class="sym-btn" data-sym=")">)</button>
        <button class="sym-btn" data-sym="<">&lt;</button>
        <button class="sym-btn" data-sym=">">&gt;</button>
        <button class="sym-btn" data-sym="/">/</button>
        <button class="sym-btn" data-sym="=">=</button>
        <button class="sym-btn" data-sym='"'>"</button>
        <button class="sym-btn" data-sym=";">;</button>
    </div>

    <div class="preview-overlay" id="previewOverlay">
        <div class="preview-bar">
            <span style="font-weight:600;font-size:0.95rem;display:flex;align-items:center;">
                <i class="fa-solid fa-globe" style="color:var(--accent);margin-right:6px;"></i>Предпросмотр
            </span>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="btn-icon-only" id="previewReloadBtn" title="Перезапустить" aria-label="Перезапустить">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button class="btn-primary" id="closePreviewBtn" style="padding:6px 12px;">
                    <i class="fa-solid fa-xmark"></i> В редактор
                </button>
            </div>
        </div>
        <iframe class="preview-frame" id="previewFrame" title="Предпросмотр проекта" sandbox="allow-scripts allow-modals"></iframe>
    </div>
</div>

<div class="custom-context-menu" id="customContextMenu" role="menu">
    <button class="context-menu-item" id="ctxSelectAll" role="menuitem"><i class="fa-solid fa-check-double"></i> Выделить всё</button>
    <button class="context-menu-item" id="ctxCut" role="menuitem"><i class="fa-solid fa-cut"></i> Вырезать</button>
    <button class="context-menu-item" id="ctxCopy" role="menuitem"><i class="fa-regular fa-copy"></i> Копировать</button>
    <button class="context-menu-item" id="ctxPaste" role="menuitem"><i class="fa-regular fa-paste"></i> Вставить</button>
    <button class="context-menu-item" id="ctxClear" style="color:var(--danger);" role="menuitem"><i class="fa-regular fa-trash-can" style="color:var(--danger);"></i> Очистить</button>
</div>

<div class="modal-overlay" id="createModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
        <h3 id="modalTitle" style="font-size:1.05rem;">Новый элемент</h3>
        <div class="modal-type-select" id="typeSelector">
            <button type="button" class="type-btn active" data-type="file"><i class="fa-regular fa-file"></i> Файл</button>
            <button type="button" class="type-btn" data-type="folder"><i class="fa-regular fa-folder"></i> Папка</button>
        </div>
        <div class="modal-field" id="parentFolderField">
            <label for="parentFolderSelect">Расположение</label>
            <select id="parentFolderSelect"><option value="root">/ (Корень проекта)</option></select>
        </div>
        <div class="modal-field">
            <label for="newItemName">Название</label>
            <input type="text" id="newItemName" placeholder="Например: app.js или assets" autocomplete="off" autocapitalize="off" autocorrect="off">
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancelModal">Отмена</button>
            <button type="button" class="btn-primary" id="confirmCreate">Сохранить</button>
        </div>
    </div>
</div>

<input type="file" id="importFile" class="hidden-file-input" accept=".json,.zip">
