<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeDock Studio</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13131a">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #13131a;
            --bg-panel: #181822;
            --bg-card: #1f1f2c;
            --bg-hover: #282838;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #8e92a4;
            --border: #2c2c3d;
            --danger: #ef4444;
            --success: #4ade80;
            --info: #38bdf8;
            --warn: #facc15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0f;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .workspace {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            overflow: hidden;
        }

        .brand-header {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 50; 
            flex-shrink: 0;
        }

        .logo-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: transform 0.1s, opacity 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .logo-btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .brand-logo {
            height: 56px;
            width: auto;
            object-fit: contain;
        }

        .editor-topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .btn-icon-only {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .btn-icon-only:active {
            transform: scale(0.95);
            border-color: var(--accent);
        }

        .tabs-bar {
            flex: 1;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs-bar::-webkit-scrollbar {
            display: none;
        }

        .tab-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 11px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            position: relative;
        }

        .tab-chip.active {
            color: var(--text-main);
            border-color: var(--accent);
            background-color: rgba(139, 92, 246, 0.14);
        }

        .tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-left: 2px;
            border-radius: 4px;
            color: var(--text-muted);
            font-size: 0.75rem;
            transition: all 0.15s;
        }

        .tab-close:hover, .tab-close:active {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--danger);
        }

        .editor-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-main);
        }

        .editor-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            z-index: 10;
            flex-shrink: 0;
        }

        .action-group {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 34px;
            padding: 0 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-icon {
            padding: 0;
            width: 34px;
            background-color: var(--bg-card);
            color: var(--text-main);
            border-color: var(--border);
        }

        .btn-icon:active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-save {
            background-color: var(--bg-card);
            color: var(--text-main);
            border-color: var(--border);
        }

        .btn-save:active {
            border-color: var(--success);
        }

        .btn-run {
            background-color: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .editor-content {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .line-numbers {
            width: 44px;
            flex-shrink: 0;
            padding: 14px 0 40px 0;
            background-color: #101016;
            color: #52566b;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 21px;
            text-align: right;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid var(--border);
            touch-action: pan-y; 
        }

        .line-num-row {
            height: 21px;
            padding-right: 8px;
            display: block;
        }

        .line-num-row.active-line {
            color: var(--accent);
            font-weight: 700;
            background-color: rgba(139, 92, 246, 0.1);
        }

        .code-textarea {
            flex: 1;
            width: 100%;
            height: 100%;
            background: transparent;
            color: #e5e7eb;
            border: none;
            outline: none;
            resize: none;
            padding: 14px 12px 40px 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 21px;
            tab-size: 2;
            white-space: pre;
            overflow-x: auto;
            overflow-y: scroll;
            autocorrect: off;
        }

        .edge-swipe-area {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 15px;
            z-index: 15;
            touch-action: pan-y;
        }

        .drawer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease;
            z-index: 20;
        }

        .drawer-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .file-drawer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 84%;
            max-width: 340px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 30;
            touch-action: pan-y;
        }

        .file-drawer.open {
            transform: translateX(0);
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-main);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 11px;
            border-radius: 11px;
            width: 100%;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
        }

        .search-box {
            padding: 10px 14px 6px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 25px;
            top: calc(50% + 2px);
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .search-box input {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            padding: 9px 10px 9px 32px;
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            font-size: 0.88rem;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .file-tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px 14px;
            touch-action: pan-y;
        }

        .tree-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            margin-bottom: 6px;
            background-color: var(--bg-card);
            border: 1px solid transparent;
            border-radius: 11px;
            cursor: pointer;
        }

        .tree-item.active {
            border-color: var(--accent);
            background-color: rgba(139, 92, 246, 0.14);
        }

        .tree-info {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .tree-info span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
        }

        .chevron-icon {
            font-size: 0.68rem;
            color: var(--text-muted);
            width: 10px;
            transition: transform 0.2s;
        }

        .chevron-icon.rotated {
            transform: rotate(90deg);
        }

        .folder-children {
            padding-left: 14px;
            border-left: 1px dashed var(--border);
            margin-left: 12px;
            margin-bottom: 6px;
            display: none;
        }

        .folder-children.open {
            display: block;
        }

        .tree-actions {
            display: flex;
            gap: 4px;
            margin-left: 6px;
        }

        .action-icon {
            background-color: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .action-icon.delete:hover {
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.15);
        }

        .icon-html { color: #e34c26; }
        .icon-css { color: #38bdf8; }
        .icon-js { color: #facc15; }
        .icon-json { color: #4ade80; }
        .icon-folder { color: #a78bfa; }
        .icon-default { color: var(--text-muted); }

        .project-stats {
            padding: 7px 14px;
            font-size: 0.76rem;
            color: var(--text-muted);
            background-color: var(--bg-main);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .file-footer {
            padding: 10px 14px 14px;
            background-color: var(--bg-main);
        }

        .preview-overlay {
            position: absolute;
            inset: 0;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.25s ease;
            z-index: 40;
        }

        .preview-overlay.open {
            transform: translateY(0);
        }

        .preview-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background-color: var(--bg-main);
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
        }

        .preview-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
        }

        /* --- КОНСОЛЬ (UI) --- */
        .console-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 35;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        .console-panel.open {
            transform: translateY(0);
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
        }

        .console-header-actions {
            display: flex;
            gap: 8px;
        }

        .console-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
        }

        .console-btn:active {
            color: var(--accent);
        }

        .console-output {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            line-height: 1.4;
        }

        .console-line {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            word-wrap: break-word;
            white-space: pre-wrap;
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .console-line i {
            margin-top: 2px;
            font-size: 10px;
        }

        .console-line.log { color: var(--text-main); }
        .console-line.info { color: var(--info); }
        .console-line.warn { color: var(--warn); background: rgba(250, 204, 21, 0.1); }
        .console-line.error { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

        .custom-context-menu {
            position: fixed;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            padding: 6px;
            z-index: 9999;
            min-width: 160px;
            backdrop-filter: blur(8px);
        }

        .custom-context-menu.open {
            display: flex;
        }

        .context-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
        }

        .context-menu-item:hover {
            background-color: var(--bg-hover);
            color: var(--accent);
        }

        .context-menu-item i {
            width: 16px;
            text-align: center;
            color: var(--text-muted);
        }

        .context-menu-item:hover i {
            color: var(--accent);
        }

        .symbol-bar {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
            position: relative;
            z-index: 20;
        }

        .symbol-bar::-webkit-scrollbar {
            display: none;
        }

        .sym-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            min-width: 36px;
            height: 34px;
            padding: 0 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .sym-btn:active {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--bg-card);
            width: 90%;
            max-width: 340px;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-type-select {
            display: flex;
            gap: 8px;
        }

        .type-btn {
            flex: 1;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
        }

        .type-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .modal-field label {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .modal-card input,
        .modal-card select {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.92rem;
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .modal-actions button {
            flex: 1;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="workspace" id="workspace">
    <div class="brand-header">
        <button class="logo-btn" id="resetCacheBtn" title="Сбросить кэш и перезагрузить">
            <img src="logo.png" alt="CodeDock Studio" class="brand-logo" onerror="this.style.display='none'">
        </button>
    </div>

    <header class="editor-topbar">
        <button class="btn-icon-only" id="openDrawerBtn" title="Файлы проекта">
            <i class="fa-solid fa-folder-tree"></i>
        </button>
        <div class="tabs-bar" id="tabsBar"></div>
    </header>

    <main class="editor-body">
        <div class="editor-action-bar">
            <div class="action-group">
                <button class="btn-action btn-icon" id="undoBtn" title="Отменить">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button class="btn-action btn-icon" id="redoBtn" title="Повторить">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            <div class="action-group">
                <button class="btn-action btn-icon" id="consoleBtn" title="Консоль">
                    <i class="fa-solid fa-terminal"></i>
                </button>
                <button class="btn-action btn-save" id="saveProjectBtn">
                    <i class="fa-solid fa-floppy-disk"></i> Сохранить
                </button>
                <button class="btn-action btn-run" id="runProjectBtn">
                    <i class="fa-solid fa-play"></i> Запуск
                </button>
            </div>
        </div>

        <div class="editor-content">
            <div class="line-numbers" id="lineNumbers"></div>
            <textarea class="code-textarea" id="codeEditor" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" inputmode="text" placeholder="// Создайте новый файл в меню слева"></textarea>
            <div class="edge-swipe-area" id="edgeSwipeArea"></div>
        </div>

        <!-- Панель консоли -->
        <div class="console-panel" id="consolePanel">
            <div class="console-header">
                <span><i class="fa-solid fa-terminal"></i> Консоль</span>
                <div class="console-header-actions">
                    <button class="console-btn" id="clearConsoleBtn" title="Очистить"><i class="fa-solid fa-trash"></i></button>
                    <button class="console-btn" id="closeConsoleBtn" title="Закрыть"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="console-output" id="consoleOutput"></div>
        </div>

        <div class="drawer-backdrop" id="drawerBackdrop"></div>
        
        <aside class="file-drawer" id="fileDrawer">
            <div class="file-header">
                <div class="header-title">
                    <i class="fa-solid fa-folder-tree"></i>
                    <span>Файлы</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon-only" style="width:32px;height:32px;" id="collapseAllBtn" title="Свернуть папки">
                        <i class="fa-solid fa-angles-up"></i>
                    </button>
                    <button class="btn-primary" id="openCreateModal">
                        <i class="fa-solid fa-plus"></i> Новый
                    </button>
                </div>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="fileSearch" placeholder="Поиск файлов...">
            </div>
            <div class="file-tree-container" id="fileTree"></div>
            <div class="project-stats">
                <span id="statsText">Файлов: 0 | Папок: 0</span>
                <span id="linesCountText">Строк: 0</span>
            </div>

    <div class="preview-overlay" id="previewOverlay">

<div class="custom-context-menu" id="customContextMenu">
    <button class="context-menu-item" id="ctxSelectAll"><i class="fa-solid fa-check-double"></i> Выделить всё</button>
    <button class="context-menu-item" id="ctxCut"><i class="fa-solid fa-cut"></i> Вырезать</button>
    <button class="context-menu-item" id="ctxCopy"><i class="fa-regular fa-copy"></i> Копировать</button>
    <button class="context-menu-item" id="ctxPaste"><i class="fa-regular fa-paste"></i> Вставить</button>
    <button class="context-menu-item" id="ctxClear" style="color:var(--danger);"><i class="fa-regular fa-trash-can" style="color:var(--danger);"></i> Очистить</button>

<div class="modal-overlay" id="createModal">
    <div class="modal-card">
        <h3 id="modalTitle" style="font-size:1.05rem;">Новый элемент</h3>

        </div>

            <button type="button" class="btn-secondary" id="cancelModal">Отмена</button>

</div>

<script>
    // --- КЛАСС КОНСОЛИ ---
    const CONSOLE_INJECT_SCRIPT = `
        (function() {
            const sendToParent = (type, args) => {
                try {
                    const serializedArgs = Array.from(args).map(arg => {
                        if (typeof arg === 'object' && arg !== null) {
                            try { return JSON.stringify(arg); } catch(e) { return String(arg); }
                        }
                        return String(arg);
                    });
                    window.parent.postMessage({ type: 'codedock-console', logType: type, message: serializedArgs.join(' ') }, '*');
                } catch(e) {}
            };
            console.log = (...args) => sendToParent('log', args);
            console.info = (...args) => sendToParent('info', args);
            console.warn = (...args) => sendToParent('warn', args);
            console.error = (...args) => sendToParent('error', args);
            window.onerror = function(message, source, lineno, colno, error) {
                sendToParent('error', [message + ' (строка ' + lineno + ')']);
            };
        })();
    `;

    class CodeDockConsole {
        constructor(panelId, outputId, btnId, closeBtnId, clearBtnId) {
            this.panel = document.getElementById(panelId);
            this.output = document.getElementById(outputId);
            this.btn = document.getElementById(btnId);
            this.closeBtn = document.getElementById(closeBtnId);
            this.clearBtn = document.getElementById(clearBtnId);

            this.init();
        }

        init() {
            this.btn.addEventListener('click', () => this.toggle());
            this.closeBtn.addEventListener('click', () => this.close());
            this.clearBtn.addEventListener('click', () => this.clear());

            window.addEventListener('message', (e) => {
                if (!e.data || e.data.type !== 'codedock-console') return;
                this.log(e.data.logType, e.data.message);
            });
        }

        toggle() {
            this.panel.classList.toggle('open');
            if (this.panel.classList.contains('open')) {
                setTimeout(() => { this.output.scrollTop = this.output.scrollHeight; }, 300);
            }
        }

        open() {
            this.panel.classList.add('open');
            setTimeout(() => { this.output.scrollTop = this.output.scrollHeight; }, 300);
        }

        close() {
            this.panel.classList.remove('open');
        }

        clear() {
            this.output.innerHTML = '';
        }

        log(type, message) {
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            
            let icon = 'fa-angle-right';
            if (type === 'error') icon = 'fa-circle-exclamation';
            if (type === 'warn') icon = 'fa-triangle-exclamation';
            if (type === 'info') icon = 'fa-circle-info';

            const safeMsg = String(message).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));

            line.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${safeMsg}</span>`;
            this.output.appendChild(line);
            
            if (this.panel.classList.contains('open')) {
                this.output.scrollTop = this.output.scrollHeight;
            }
        }
    }

    // Инициализация консоли
    const consolePanel = new CodeDockConsole(
        'consolePanel', 
        'consoleOutput', 
        'consoleBtn', 
        'closeConsoleBtn', 
        'clearConsoleBtn'
    );

    // Регистрация Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
        });
    }

    // ОЧИСТКА КЭША
    document.getElementById('resetCacheBtn').addEventListener('click', async () => {
        const confirmReset = confirm('Очистить кэш и обновить приложение?');
        if (!confirmReset) return;
        try {
            if ('caches' in window) {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
            }
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) await registration.unregister();
            }
            
            alert('Кэш сброшен. Загрузка свежей версии...');
            const url = new URL(window.location.href);
            url.searchParams.set('nocache', Date.now());
            window.location.replace(url.toString());
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    });

    const DEFAULT_PROJECT = [
        {
            id: '1',
            name: 'index.html',
            type: 'file',
            content: '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="UTF-8">\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <div class="card">\n    <h1>CodeDock IDE</h1>\n    <p>Нажми кнопку ниже для проверки JS</p>\n    <button onclick="sayHi()">Нажми меня</button>\n  </div>\n  <script src="script.js"><\/script>\n</body>\n</html>'
        },
        {
            id: '2',
            name: 'style.css',
            type: 'file',
            content: 'body {\n  margin: 0;\n  min-height: 100vh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  background: #13131a;\n  color: #fff;\n  font-family: sans-serif;\n}\n.card {\n  background: #1f1f2c;\n  padding: 24px;\n  border-radius: 16px;\n  text-align: center;\n  border: 1px solid #8b5cf6;\n}\nbutton {\n  background: #8b5cf6;\n  color: #fff;\n  border: none;\n  padding: 10px 18px;\n  border-radius: 10px;\n  font-size: 16px;\n  margin-top: 10px;\n}'
        },
        {
            id: '3',
            name: 'script.js',
            type: 'file',
            content: 'function sayHi() {\n  console.log("Привет из CodeDock!");\n  console.warn("Это предупреждение");\n  console.error("А это тестовая ошибка");\n}'
        },
        {
            id: '4',
            name: 'data',
            type: 'folder',
            isOpen: true,
            children: [
                { id: '5', name: 'data.json', type: 'file', content: '{\n  "app": "CodeDock",\n  "version": "2.0"\n}' }
            ]
        }
    ];

    function safeParse(json, fallback) {
        try { return JSON.parse(json); } catch (e) { return fallback; }
    }

    let fileSystem = safeParse(localStorage.getItem('codedock_tree_v2'), null) || JSON.parse(JSON.stringify(DEFAULT_PROJECT));
    let activeFileId = localStorage.getItem('codedock_active_v2') || '1';
    let openFileIds = safeParse(localStorage.getItem('codedock_open_tabs'), null);
    
    if (!openFileIds || !Array.isArray(openFileIds) || openFileIds.length === 0) {
        openFileIds = activeFileId ? [activeFileId] : [];
    }

    let creatingType = 'file';
    let editingItemId = null;
    let searchQuery = '';
    let lastRenderedFileId = null;

    const codeEditor = document.getElementById('codeEditor');
    const lineNumbers = document.getElementById('lineNumbers');
    const tabsBar = document.getElementById('tabsBar');
    const fileTreeEl = document.getElementById('fileTree');
    const statsTextEl = document.getElementById('statsText');
    const linesCountText = document.getElementById('linesCountText');

    const fileDrawer = document.getElementById('fileDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const createModal = document.getElementById('createModal');
    const newItemNameInput = document.getElementById('newItemName');
    const parentFolderSelect = document.getElementById('parentFolderSelect');
    const modalTitle = document.getElementById('modalTitle');
    const typeSelector = document.getElementById('typeSelector');
    const parentFolderField = document.getElementById('parentFolderField');

    const customContextMenu = document.getElementById('customContextMenu');

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function genId() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return Date.now().toString() + Math.random().toString(36).slice(2, 8);
    }

    function saveState() {
        try {
            localStorage.setItem('codedock_tree_v2', JSON.stringify(fileSystem));
            localStorage.setItem('codedock_active_v2', activeFileId || '');
            localStorage.setItem('codedock_open_tabs', JSON.stringify(openFileIds));
        } catch (e) {}
    }

    function getFileIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        switch (ext) {
            case 'html': return '<i class="fa-brands fa-html5 icon-html"></i>';
            case 'css':  return '<i class="fa-brands fa-css3-alt icon-css"></i>';
            case 'js':   return '<i class="fa-brands fa-js icon-js"></i>';
            case 'json': return '<i class="fa-solid fa-code icon-json"></i>';
            default:     return '<i class="fa-regular fa-file-code icon-default"></i>';
        }
    }

    function findItemById(items, id) {
        for (const item of items) {
            if (item.id === id) return item;
            if (item.children) {
                const found = findItemById(item.children, id);
                if (found) return found;
            }
        }
        return null;
    }

    function getAllFiles(items, list = []) {
        items.forEach(item => {
            if (item.type === 'file') list.push(item);
            else if (item.children) getAllFiles(item.children, list);
        });
        return list;
    }

    function getActiveLineIndex() {
        const pos = codeEditor.selectionStart || 0;
        return codeEditor.value.substring(0, pos).split('\n').length;
    }

    function updateLineNumbers() {
        const totalLines = codeEditor.value.split('\n').length;
        const activeLine = getActiveLineIndex();
        let html = '';
        for (let i = 1; i <= totalLines; i++) {
            html += `<span class="line-num-row ${i === activeLine ? 'active-line' : ''}">${i}</span>`;
        }
        lineNumbers.innerHTML = html;
        lineNumbers.scrollTop = codeEditor.scrollTop;
        linesCountText.textContent = `Строк: ${totalLines}`;
    }

    function renderEditorAndTabs() {
        const allFiles = getAllFiles(fileSystem);
        
        openFileIds = openFileIds.filter(id => allFiles.some(f => f.id === id));
        
        let currentFile = findItemById(fileSystem, activeFileId);
        
        if (!currentFile && openFileIds.length > 0) {
            activeFileId = openFileIds[0];
            currentFile = findItemById(fileSystem, activeFileId);
        } else if (openFileIds.length === 0) {
            activeFileId = null;
            currentFile = null;
        }

        tabsBar.innerHTML = '';
        openFileIds.forEach(id => {
            const file = allFiles.find(f => f.id === id);
            if (!file) return;

            const tab = document.createElement('div');
            tab.className = `tab-chip ${file.id === activeFileId ? 'active' : ''}`;
            tab.innerHTML = `
                ${getFileIcon(file.name)}
                <span>${escapeHtml(file.name)}</span>
                <div class="tab-close" title="Закрыть"><i class="fa-solid fa-xmark"></i></div>
            `;

            tab.addEventListener('click', (e) => {
                if (e.target.closest('.tab-close')) return;
                activeFileId = file.id;
                saveState();
                renderEditorAndTabs();
                renderTree();
            });

            tab.querySelector('.tab-close').addEventListener('click', (e) => {
                e.stopPropagation();
                
                const currentFileData = findItemById(fileSystem, activeFileId);
                if (currentFileData && !codeEditor.disabled) {
                    currentFileData.content = codeEditor.value;
                }
                saveState();
                
                openFileIds = openFileIds.filter(fId => fId !== file.id);
                if (activeFileId === file.id) {
                    activeFileId = openFileIds.length > 0 ? openFileIds[0] : null;
                    lastRenderedFileId = null;
                }
                saveState();
                renderEditorAndTabs();
            });

            tabsBar.appendChild(tab);
        });

        if (currentFile) {
            codeEditor.disabled = false;
            if (lastRenderedFileId !== currentFile.id) {
                codeEditor.value = currentFile.content || '';
                lastRenderedFileId = currentFile.id;
            }
            codeEditor.placeholder = '';
        } else {
            codeEditor.disabled = true;
            codeEditor.value = '';
            codeEditor.placeholder = '// Файл не выбран';
            lastRenderedFileId = null;
        }
        updateLineNumbers();
    }

    codeEditor.addEventListener('input', () => {
        const currentFile = findItemById(fileSystem, activeFileId);
        if (currentFile) {
            currentFile.content = codeEditor.value;
            saveState();
        }
        updateLineNumbers();
    });

    codeEditor.addEventListener('click', updateLineNumbers);
    codeEditor.addEventListener('keyup', updateLineNumbers);
    codeEditor.addEventListener('scroll', () => {
        lineNumbers.scrollTop = codeEditor.scrollTop;
    });

    codeEditor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && !codeEditor.disabled) {
            e.preventDefault();
            const start = codeEditor.selectionStart;
            const end = codeEditor.selectionEnd;
            const text = codeEditor.value;
            codeEditor.value = text.substring(0, start) + '  ' + text.substring(end);
            codeEditor.selectionStart = codeEditor.selectionEnd = start + 2;
            codeEditor.dispatchEvent(new Event('input'));
        }
    });

    newItemNameInput.addEventListener('input', (e) => {
        let val = e.target.value;
        if (val.length > 0) {
            let newVal = val.charAt(0).toLowerCase() + val.slice(1);
            if (val !== newVal) {
                const start = e.target.selectionStart;
                const end = e.target.selectionEnd;
                e.target.value = newVal;
                e.target.setSelectionRange(start, end);
            }
        }
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (codeEditor.disabled) return;
        codeEditor.focus();
        document.execCommand('undo');
        codeEditor.dispatchEvent(new Event('input'));
    });

    document.getElementById('redoBtn').addEventListener('click', () => {
        if (codeEditor.disabled) return;
        codeEditor.focus();
        document.execCommand('redo');
        codeEditor.dispatchEvent(new Event('input'));
    });

    const saveBtn = document.getElementById('saveProjectBtn');
    const originalSaveHTML = saveBtn.innerHTML;
    saveBtn.addEventListener('click', () => {
        const cur = findItemById(fileSystem, activeFileId);
        if (cur) cur.content = codeEditor.value;
        saveState();
        saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Сохранено';
        saveBtn.style.color = 'var(--success)';
        saveBtn.style.borderColor = 'var(--success)';
        setTimeout(() => {
            saveBtn.innerHTML = originalSaveHTML;
            saveBtn.style.color = '';
            saveBtn.style.borderColor = '';
        }, 1500);
    });

    let touchStartX = 0;
    let touchStartY = 0;
    let isDraggingDrawer = false;
    let drawerWidthPx = 0;
    let swipeDirection = null;
    let swipeLocked = false;

    const workspaceEl = document.getElementById('workspace');

    workspaceEl.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        const touch = e.touches[0];
        const target = e.target;
        const isDrawerOpen = fileDrawer.classList.contains('open');

        if (!isDrawerOpen) {
            if (target.closest('.line-numbers') || target.closest('.edge-swipe-area')) {
                swipeDirection = 'open';
            }
        } else {
            if (target.closest('.file-drawer')) {
                swipeDirection = 'close';
            }
        }

        if (swipeDirection) {
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            drawerWidthPx = fileDrawer.offsetWidth;
            isDraggingDrawer = true;
            swipeLocked = false;
            fileDrawer.style.transition = 'none';
            drawerBackdrop.style.transition = 'none';
        }
    }, { passive: true });

    workspaceEl.addEventListener('touchmove', (e) => {
        if (!isDraggingDrawer) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;

        if (!swipeLocked) {
            if (Math.abs(deltaX) > Math.abs(deltaY) + 5) {
                swipeLocked = true;
            } else if (Math.abs(deltaY) > Math.abs(deltaX) + 5) {
                isDraggingDrawer = false;
                resetDrawerStyle();
                return;
            }
        }

        if (swipeLocked) {
            e.preventDefault();
            if (swipeDirection === 'open' && deltaX > 0) {
                const move = Math.min(deltaX, drawerWidthPx);
                fileDrawer.style.transform = `translateX(${-drawerWidthPx + move}px)`;
                drawerBackdrop.style.opacity = move / drawerWidthPx;
            } else if (swipeDirection === 'close' && deltaX < 0) {
                const move = Math.min(Math.abs(deltaX), drawerWidthPx);
                fileDrawer.style.transform = `translateX(${-move}px)`;
                drawerBackdrop.style.opacity = 1 - (move / drawerWidthPx);
            }
        }
    }, { passive: false });

    workspaceEl.addEventListener('touchend', (e) => {
        if (!isDraggingDrawer) return;
        isDraggingDrawer = false;
        
        if (!swipeLocked) {
            resetDrawerStyle();
            swipeDirection = null;
            return;
        }

        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - touchStartX;
        
        fileDrawer.style.transition = '';
        drawerBackdrop.style.transition = '';

        if (swipeDirection === 'open') {
            if (deltaX > drawerWidthPx * 0.3) openDrawer();
            else closeDrawer();
        } else if (swipeDirection === 'close') {
            if (deltaX < -(drawerWidthPx * 0.3)) closeDrawer();
            else openDrawer();
        }
        swipeDirection = null;
    });

    function resetDrawerStyle() {
        fileDrawer.style.transition = '';
        drawerBackdrop.style.transition = '';
        fileDrawer.style.transform = '';
        drawerBackdrop.style.opacity = '';
    }

    let longPressTimer = null;
    let touchMoved = false;
    let lastTapTime = 0;
    let lastTapX = 0;
    let lastTapY = 0;
    let lastDoubleTapAt = 0;

    const LONG_PRESS_DELAY = 700;
    const DOUBLE_TAP_DELAY = 300;
    const DOUBLE_TAP_DISTANCE = 40;

    function showContextMenu(clientX, clientY) {
        customContextMenu.classList.add('open');
        const rect = customContextMenu.getBoundingClientRect();
        let x = clientX;
        let y = clientY;
        
        if (x + rect.width > window.innerWidth - 10) x = window.innerWidth - rect.width - 10;
        if (y + rect.height > window.innerHeight - 10) y = window.innerHeight - rect.height - 10;
        
        customContextMenu.style.left = `${Math.max(10, x)}px`;
        customContextMenu.style.top = `${Math.max(10, y)}px`;
    }

    function hideContextMenu() {
        customContextMenu.classList.remove('open');
    }

    codeEditor.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY);
    });

    codeEditor.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        const touch = e.touches[0];
        const now = Date.now();
        touchMoved = false;

        const isDoubleTap =
            (now - lastTapTime < DOUBLE_TAP_DELAY) &&
            Math.abs(touch.clientX - lastTapX) < DOUBLE_TAP_DISTANCE &&
            Math.abs(touch.clientY - lastTapY) < DOUBLE_TAP_DISTANCE;

        if (isDoubleTap) {
            clearTimeout(longPressTimer);
            lastTapTime = 0;
            lastDoubleTapAt = now;
            showContextMenu(touch.clientX, touch.clientY);
            return;
        }

        lastTapTime = now;
        lastTapX = touch.clientX;
        lastTapY = touch.clientY;

        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
            if (!touchMoved) showContextMenu(touch.clientX, touch.clientY);
        }, LONG_PRESS_DELAY);
    });

    codeEditor.addEventListener('dblclick', (e) => {
        if (Date.now() - lastDoubleTapAt < 500) return;
        showContextMenu(e.clientX, e.clientY);
    });

    codeEditor.addEventListener('touchmove', () => {
        touchMoved = true;
        clearTimeout(longPressTimer);
    });

    codeEditor.addEventListener('touchend', () => {
        clearTimeout(longPressTimer);
    });

    window.addEventListener('pointerdown', (e) => {
        if (!customContextMenu.contains(e.target)) hideContextMenu();
    });

    function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        ta.remove();
    }

    function safeCopy(text) {
        if (!text) return;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
        } else {
            legacyCopy(text);
        }
    }

    document.getElementById('ctxSelectAll').onpointerdown = (e) => {
        e.preventDefault();
        codeEditor.focus({ preventScroll: true });
        codeEditor.setSelectionRange(0, codeEditor.value.length);
    };

    document.getElementById('ctxCut').onpointerdown = (e) => {
        e.preventDefault();
        const start = codeEditor.selectionStart;
        const end = codeEditor.selectionEnd;
        const selText = codeEditor.value.substring(start, end);
        if (selText) {
            safeCopy(selText);
            codeEditor.value = codeEditor.value.substring(0, start) + codeEditor.value.substring(end);
            codeEditor.selectionStart = codeEditor.selectionEnd = start;
            codeEditor.dispatchEvent(new Event('input'));
        }
        hideContextMenu();
    };

    document.getElementById('ctxCopy').onpointerdown = (e) => {
        e.preventDefault();
        const text = codeEditor.value.substring(codeEditor.selectionStart, codeEditor.selectionEnd) || codeEditor.value;
        safeCopy(text);
        hideContextMenu();
    };

    document.getElementById('ctxPaste').onpointerdown = async (e) => {
        e.preventDefault();
        hideContextMenu();
        try {
            if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error('Clipboard API недоступен');
            const text = await navigator.clipboard.readText();
            const start = codeEditor.selectionStart;
            const end = codeEditor.selectionEnd;
            codeEditor.value = codeEditor.value.substring(0, start) + text + codeEditor.value.substring(end);
            codeEditor.selectionStart = codeEditor.selectionEnd = start + text.length;
            codeEditor.dispatchEvent(new Event('input'));
        } catch (err) {
            alert('Вставка из буфера недоступна. Используйте системное меню «Вставить».');
        }
    };

    document.getElementById('ctxClear').onpointerdown = (e) => {
        e.preventDefault();
        codeEditor.value = '';
        codeEditor.dispatchEvent(new Event('input'));
        hideContextMenu();
    };

    document.getElementById('symbolBar').addEventListener('click', (e) => {
        const btn = e.target.closest('.sym-btn');
        if (!btn || codeEditor.disabled) return;
        const sym = btn.dataset.sym;
        const start = codeEditor.selectionStart;
        const end = codeEditor.selectionEnd;
        const text = codeEditor.value;

        codeEditor.value = text.substring(0, start) + sym + text.substring(end);
        codeEditor.selectionStart = codeEditor.selectionEnd = start + sym.length;
        codeEditor.focus();
        codeEditor.dispatchEvent(new Event('input'));
    });

    const closeDrawerBtn = document.getElementById('closeDrawerBtn');

    function openDrawer() {
        fileDrawer.style.transform = '';
        drawerBackdrop.style.opacity = '';
        fileDrawer.classList.add('open');
        drawerBackdrop.classList.add('open');
    }

    function closeDrawer() {
        fileDrawer.style.transform = '';
        drawerBackdrop.style.opacity = '';
        fileDrawer.classList.remove('open');
        drawerBackdrop.classList.remove('open');
    }

    document.getElementById('openDrawerBtn').onclick = openDrawer;
    closeDrawerBtn.onclick = closeDrawer;
    drawerBackdrop.onclick = closeDrawer;

    document.getElementById('runProjectBtn').onclick = () => {
        const allFiles = getAllFiles(fileSystem);
        const htmlFile = allFiles.find(f => f.name.toLowerCase() === 'index.html')
            || allFiles.find(f => f.name.toLowerCase().endsWith('.html'));
        const cssFiles = allFiles.filter(f => f.name.toLowerCase().endsWith('.css'));
        const jsFiles = allFiles.filter(f => f.name.toLowerCase().endsWith('.js'));

        let html = htmlFile ? htmlFile.content : '<h2>Файл index.html не найден</h2>';

        let doc;
        try {
            doc = new DOMParser().parseFromString(html, 'text/html');
        } catch (e) {
            doc = null;
        }

        if (doc) {
            doc.querySelectorAll('link[rel="stylesheet"]').forEach(el => el.remove());
            doc.querySelectorAll('script[src]').forEach(el => el.remove());
            if (!doc.head) doc.documentElement.insertBefore(doc.createElement('head'), doc.body || null);

            const script = doc.createElement('script');
            script.textContent = CONSOLE_INJECT_SCRIPT;
            doc.head.insertBefore(script, doc.head.firstChild);

            cssFiles.forEach(f => {
                const style = doc.createElement('style');
                style.textContent = f.content || '';
                doc.head.appendChild(style);
            });
            jsFiles.forEach(f => {
                const script = doc.createElement('script');
                script.textContent = f.content || '';
                (doc.body || doc.head).appendChild(script);
            });
            html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        }

        consolePanel.clear();
        
        document.getElementById('previewFrame').srcdoc = html;
        document.getElementById('previewOverlay').classList.add('open');
    };

    document.getElementById('closePreviewBtn').onclick = () => {
        document.getElementById('previewOverlay').classList.remove('open');
    };

    function populateFolderSelect(selectedId = 'root') {
        parentFolderSelect.innerHTML = '<option value="root">/ (Корень проекта)</option>';
        function traverse(items, prefix = '') {
            items.forEach(item => {
                if (item.type === 'folder') {
                    const opt = document.createElement('option');
                    opt.value = item.id;
                    opt.textContent = `${prefix}/${item.name}`;
                    parentFolderSelect.appendChild(opt);
                    if (item.children) traverse(item.children, `${prefix}/${item.name}`);
                }
            });
        }
        traverse(fileSystem);
        parentFolderSelect.value = selectedId;
    }

    window.deleteItem = function(id, event) {
        if (event) event.stopPropagation();
        const wasActive = (id === activeFileId);
        function removeFrom(arr) {
            return arr.filter(item => {
                if (item.id === id) return false;
                if (item.children) item.children = removeFrom(item.children);
                return true;
            });
        }
        fileSystem = removeFrom(fileSystem);
        
        openFileIds = openFileIds.filter(fId => fId !== id);

        if (wasActive) {
            activeFileId = openFileIds.length ? openFileIds[0] : '';
            lastRenderedFileId = null;
        }
        saveState();
        renderAll();
    };

    window.openCreateInFolder = function(folderId, event) {
        if (event) event.stopPropagation();
        editingItemId = null;
        creatingType = 'file';
        document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === 'file'));
        modalTitle.textContent = 'Новый элемент';
        typeSelector.style.display = 'flex';
        parentFolderField.style.display = 'flex';
        populateFolderSelect(folderId);
        newItemNameInput.value = '';
        createModal.classList.add('open');
        setTimeout(() => newItemNameInput.focus(), 50);
    };

    window.openRenameModal = function(id, event) {
        if (event) event.stopPropagation();
        const item = findItemById(fileSystem, id);
        if (!item) return;
        editingItemId = id;
        modalTitle.textContent = 'Переименовать';
        typeSelector.style.display = 'none';
        parentFolderField.style.display = 'none';
        newItemNameInput.value = item.name;
        createModal.classList.add('open');
        setTimeout(() => { newItemNameInput.focus(); newItemNameInput.select(); }, 50);
    };

    document.getElementById('openCreateModal').onclick = () => {
        editingItemId = null;
        creatingType = 'file';
        document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === 'file'));
        modalTitle.textContent = 'Новый элемент';
        typeSelector.style.display = 'flex';
        parentFolderField.style.display = 'flex';
        populateFolderSelect('root');
        newItemNameInput.value = '';
        createModal.classList.add('open');
        setTimeout(() => newItemNameInput.focus(), 50);
    };

    document.getElementById('cancelModal').onclick = () => createModal.classList.remove('open');

    document.querySelectorAll('.type-btn').forEach(btn => {
        btn.onclick = (e) => {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            creatingType = e.currentTarget.dataset.type;
        };
    });

    function nameExistsInParent(parentId, name, ignoreId) {
        const siblings = parentId === 'root' ? fileSystem : (findItemById(fileSystem, parentId)?.children || []);
        return siblings.some(s => s.name.toLowerCase() === name.toLowerCase() && s.id !== ignoreId);
    }

    function handleSave() {
        let name = newItemNameInput.value.trim();
        if (!name) return;
        name = name.charAt(0).toLowerCase() + name.slice(1);

        if (editingItemId) {
            const item = findItemById(fileSystem, editingItemId);
            if (!item) return;
            item.name = name;
        } else {
            const targetFolderId = parentFolderSelect.value;
            if (nameExistsInParent(targetFolderId, name, null)) {
                alert('Элемент с таким именем уже существует в этой папке.');
                return;
            }
            const newItem = {
                id: genId(),
                name: name,
                type: creatingType,
                ...(creatingType === 'folder' ? { isOpen: true, children: [] } : { content: '' })
            };
            if (targetFolderId === 'root') {
                fileSystem.push(newItem);
            } else {
                const folder = findItemById(fileSystem, targetFolderId);
                if (folder && folder.children) {
                    folder.isOpen = true;
                    folder.children.push(newItem);
                }
            }
            if (creatingType === 'file') {
                activeFileId = newItem.id;
                if (!openFileIds.includes(activeFileId)) openFileIds.push(activeFileId);
                lastRenderedFileId = null;
                closeDrawer();
            }
        }
        saveState();
        createModal.classList.remove('open');
        renderAll();
    }

    document.getElementById('confirmCreate').onclick = handleSave;
    newItemNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSave(); });

    document.getElementById('fileSearch').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderTree();
    });

    document.getElementById('collapseAllBtn').onclick = () => {
        function collapse(items) {
            items.forEach(item => {
                if (item.type === 'folder') {
                    item.isOpen = false;
                    if (item.children) collapse(item.children);
                }
            });
        }
        collapse(fileSystem);
        saveState();
        renderTree();
    };

    createModal.addEventListener('click', (e) => {
        if (e.target === createModal) createModal.classList.remove('open');
    });

    function renderTree() {
        fileTreeEl.innerHTML = '';
        let fileCount = 0;
        let folderCount = 0;
        function countStats(items) {
            items.forEach(item => {
                if (item.type === 'file') fileCount++;
                else {
                    folderCount++;
                    if (item.children) countStats(item.children);
                }
            });
        }
        countStats(fileSystem);
        const visibleTree = filterTree(fileSystem, searchQuery.toLowerCase());
        function createNodes(items, parentElement) {
            items.forEach(item => {
                if (item.type === 'file') {
                    const itemEl = document.createElement('div');
                    itemEl.className = `tree-item ${item.id === activeFileId ? 'active' : ''}`;
                    itemEl.innerHTML = `
                        <div class="tree-info">
                            ${getFileIcon(item.name)}
                            <span>${escapeHtml(item.name)}</span>
                        </div>
                        <div class="tree-actions">
                            <button class="action-icon" data-action="rename">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="action-icon delete" data-action="delete">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                    itemEl.addEventListener('click', (e) => {
                        const btn = e.target.closest('button[data-action]');
                        if (btn) {
                            e.stopPropagation();
                            if (btn.dataset.action === 'rename') window.openRenameModal(item.id, e);
                            else if (btn.dataset.action === 'delete') window.deleteItem(item.id, e);
                            return;
                        }
                        activeFileId = item.id;
                        if (!openFileIds.includes(activeFileId)) openFileIds.push(activeFileId);
                        saveState();
                        renderAll();
                        closeDrawer();
                    });
                    parentElement.appendChild(itemEl);
                } else if (item.type === 'folder') {
                    const wrapperEl = document.createElement('div');
                    const headerEl = document.createElement('div');
                    headerEl.className = 'tree-item';
                    headerEl.innerHTML = `
                        <div class="tree-info">
                            <i class="fa-solid fa-chevron-right chevron-icon ${item.isOpen ? 'rotated' : ''}"></i>
                            <i class="fa-solid ${item.isOpen ? 'fa-folder-open' : 'fa-folder'} icon-folder"></i>
                            <span>${escapeHtml(item.name)}</span>
                        </div>
                        <div class="tree-actions">
                            <button class="action-icon" data-action="create">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            <button class="action-icon" data-action="rename">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="action-icon delete" data-action="delete">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = `folder-children ${item.isOpen ? 'open' : ''}`;
                    headerEl.addEventListener('click', (e) => {
                        const btn = e.target.closest('button[data-action]');
                        if (btn) {
                            e.stopPropagation();
                            if (btn.dataset.action === 'create') window.openCreateInFolder(item.id, e);
                            else if (btn.dataset.action === 'rename') window.openRenameModal(item.id, e);
                            else if (btn.dataset.action === 'delete') window.deleteItem(item.id, e);
                            return;
                        }
                        if (searchQuery) return;
                        const realFolder = findItemById(fileSystem, item.id);
                        if (realFolder) {
                            realFolder.isOpen = !realFolder.isOpen;
                            saveState();
                            renderTree();
                        }
                    });
                    wrapperEl.appendChild(headerEl);
                    wrapperEl.appendChild(childrenContainer);
                    parentElement.appendChild(wrapperEl);
                    if (item.children && item.children.length > 0) {
                        createNodes(item.children, childrenContainer);
                    }
                }
            });
        }
        createNodes(visibleTree, fileTreeEl);
        statsTextEl.textContent = `Файлов: ${fileCount} | Папок: ${folderCount}`;
    }

    function filterTree(items, query) {
        if (!query) return items;
        const result = [];
        for (const item of items) {
            if (item.type === 'file') {
                if (item.name.toLowerCase().includes(query)) result.push(item);
            } else if (item.type === 'folder') {
                const filteredChildren = filterTree(item.children || [], query);
                if (item.name.toLowerCase().includes(query) || filteredChildren.length > 0) {
                    result.push({ ...item, isOpen: true, children: filteredChildren });
                }
            }
        }
        return result;
    }

    function renderAll() {
        renderEditorAndTabs();
        renderTree();
    }

    // Перехват системной кнопки "Назад"
    history.pushState({ isApp: true }, '');
    
    window.addEventListener('popstate', function(e) {
        // Проверяем открытые панели сверху вниз (от самых приоритетных)
        if (customContextMenu.classList.contains('open')) {
            hideContextMenu();
            history.pushState({ isApp: true }, '');
            return;
        }
        
        if (createModal.classList.contains('open')) {
            createModal.classList.remove('open');
            history.pushState({ isApp: true }, '');
            return;
        }

        if (document.getElementById('previewOverlay').classList.contains('open')) {
            document.getElementById('previewOverlay').classList.remove('open');
            history.pushState({ isApp: true }, '');
            return;
        }

        if (fileDrawer.classList.contains('open')) {
            closeDrawer();
            history.pushState({ isApp: true }, '');
            return;
        }

        if (consolePanel.panel.classList.contains('open')) {
            consolePanel.close();
            history.pushState({ isApp: true }, '');
            return;
        }

        // Если ничего не открыто, приложение закроется
    });

    renderAll();
</script>
</body>
</html>
